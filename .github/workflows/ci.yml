name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (stdlib) compile + smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile all sources (syntax check)
        run: python -m compileall -q python/src/minutemosaic
