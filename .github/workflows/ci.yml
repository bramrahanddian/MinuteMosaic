name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (stdlib) compile + smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile all sources (syntax check)
        run: python -m compileall -q python/src/minutemosaic
      - name: Smoke test the CLI against the example transcript
        working-directory: python/src
        run: |
          python -m minutemosaic segments ../../examples/product-sync.jsonl
          python -m minutemosaic decisions ../../examples/product-sync.jsonl
          python -m minutemosaic actions ../../examples/product-sync.jsonl
          python -m minutemosaic report ../../examples/product-sync.jsonl \
            --title "CI" --html /tmp/r.html --json /tmp/r.json
          test -s /tmp/r.html && test -s /tmp/r.json

  swift:
    name: Swift build (CI toolchain)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build the Swift package
        run: swift build -v
      - name: Render a timeline end-to-end from the example report JSON
        run: |
          python3 -m minutemosaic report ../../examples/product-sync.jsonl \
            --title "CI" --json ../../examples/product-sync.report.json
        working-directory: python/src
      - name: Run mm-timeline against the generated report
        run: swift run mm-timeline examples/product-sync.report.json --svg examples/timeline.export.svg

