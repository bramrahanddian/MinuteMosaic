[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MinuteMosaic"
version = "0.4.0"
description = "Local-first meeting intelligence with evidence provenance — stdlib-only CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MinuteMosaic contributors" }]
keywords = ["meeting", "transcript", "provenance", "local-first", "decisions", "action-items"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Office/Business",
]
# Deliberately zero runtime dependencies: stdlib only. Local-first, offline, auditable.
dependencies = []

