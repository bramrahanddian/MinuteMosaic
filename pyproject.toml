[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MinuteMosaic"
version = "0.4.0"
description = "Local-first meeting intelligence with evidence provenance — stdlib-only CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MinuteMosaic contributors" }]
keywords = ["meeting", "transcript", "provenance", "local-first", "decisions", "action-items"]
