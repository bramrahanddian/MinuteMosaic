<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Animated provenance pipeline from utterance to evidence-backed claim">
  <title>minutemosaic: provenance pipeline</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141519"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9a978d"/>
    </marker>
  </defs>

  <rect width="900" height="260" fill="url(#bg2)"/>
  <text x="24" y="32" fill="#e9e7df" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600">provenance pipeline</text>
  <text x="24" y="52" fill="#9a978d" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12">transcript in · deterministic heuristics · every claim keeps its source spans · no audio, no cloud</text>

  <!-- Audio waveform (decorative): this represents the transcript's rhythm, NOT a claim that we do ASR -->
  <g stroke="#00838f" stroke-width="2" opacity="0.8">
