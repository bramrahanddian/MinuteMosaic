<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Animated provenance pipeline from utterance to evidence-backed claim">
  <title>minutemosaic: provenance pipeline</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141519"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9a978d"/>
    </marker>
  </defs>

  <rect width="900" height="260" fill="url(#bg2)"/>
  <text x="24" y="32" fill="#e9e7df" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600">provenance pipeline</text>
  <text x="24" y="52" fill="#9a978d" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12">transcript in · deterministic heuristics · every claim keeps its source spans · no audio, no cloud</text>

  <!-- Audio waveform (decorative): this represents the transcript's rhythm, NOT a claim that we do ASR -->
  <g stroke="#00838f" stroke-width="2" opacity="0.8">
    <line x1="40" y1="150" x2="40" y2="150"><animate attributeName="y1" values="150;120;150" dur="1.2s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="y2" values="150;180;150" dur="1.2s" begin="0.0s" repeatCount="indefinite"/></line>
    <line x1="52" y1="150" x2="52" y2="150"><animate attributeName="y1" values="150;108;150" dur="1.2s" begin="0.15s" repeatCount="indefinite"/><animate attributeName="y2" values="150;192;150" dur="1.2s" begin="0.15s" repeatCount="indefinite"/></line>
    <line x1="64" y1="150" x2="64" y2="150"><animate attributeName="y1" values="150;132;150" dur="1.2s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y2" values="150;168;150" dur="1.2s" begin="0.3s" repeatCount="indefinite"/></line>
    <line x1="76" y1="150" x2="76" y2="150"><animate attributeName="y1" values="150;100;150" dur="1.2s" begin="0.45s" repeatCount="indefinite"/><animate attributeName="y2" values="150;200;150" dur="1.2s" begin="0.45s" repeatCount="indefinite"/></line>
    <line x1="88" y1="150" x2="88" y2="150"><animate attributeName="y1" values="150;128;150" dur="1.2s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y2" values="150;172;150" dur="1.2s" begin="0.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- Stage boxes -->
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">
    <rect x="120" y="120" width="130" height="60" rx="8" fill="#17181d" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="185" y="146" fill="#e9e7df">utterance</text>
    <text x="185" y="164" fill="#9a978d" font-size="10">#index · span</text>

    <rect x="300" y="120" width="130" height="60" rx="8" fill="#17181d" stroke="#e8a33d" stroke-width="1.5"/>
    <text x="365" y="146" fill="#e9e7df">heuristic rule</text>
    <text x="365" y="164" fill="#9a978d" font-size="10">trigger match</text>

    <rect x="480" y="120" width="130" height="60" rx="8" fill="#17181d" stroke="#1565c0" stroke-width="1.5"/>
    <text x="545" y="146" fill="#e9e7df">claim</text>
    <text x="545" y="164" fill="#9a978d" font-size="10">decision / action</text>

    <rect x="660" y="120" width="150" height="60" rx="8" fill="#17181d" stroke="#ad1457" stroke-width="1.5"/>
    <text x="735" y="146" fill="#e9e7df">provenance</text>
    <text x="735" y="164" fill="#9a978d" font-size="10">rule + trigger + spans</text>
  </g>

  <!-- Connecting arrows -->
  <g stroke="#9a978d" stroke-width="1.6" marker-end="url(#arrow)" fill="none">
    <line x1="250" y1="150" x2="298" y2="150"/>
