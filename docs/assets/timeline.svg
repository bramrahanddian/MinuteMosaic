<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Animated stained-glass evidence timeline">
  <title>minutemosaic: stained-glass evidence timeline</title>
  <defs>
    <linearGradient id="lead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1c22"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" fill="url(#lead)"/>
  <text x="24" y="34" fill="#e9e7df" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600">stained-glass evidence timeline</text>
  <text x="24" y="54" fill="#9a978d" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12">one facet per utterance · tinted by topic · every claim traces to source spans</text>

  <!-- Stained-glass facets: each pane lights up in sequence like leading glass -->
  <g filter="url(#glow)">
    <rect x="24"  y="80" width="70"  height="90" rx="4" fill="#c1272d" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.95;0.55" dur="4s" begin="0s"   repeatCount="indefinite"/>
    </rect>
    <rect x="98"  y="80" width="120" height="90" rx="4" fill="#e8a33d" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.95;0.55" dur="4s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="222" y="80" width="90"  height="90" rx="4" fill="#2e7d32" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.95;0.55" dur="4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="316" y="80" width="150" height="90" rx="4" fill="#1565c0" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.95;0.55" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="470" y="80" width="80"  height="90" rx="4" fill="#6a1b9a" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.95;0.55" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="554" y="80" width="130" height="90" rx="4" fill="#00838f" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.95;0.55" dur="4s" begin="2.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="688" y="80" width="100" height="90" rx="4" fill="#ad1457" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.95;0.55" dur="4s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="792" y="80" width="84"  height="90" rx="4" fill="#e8a33d" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.95;0.55" dur="4s" begin="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- A playhead sweeping the timeline like an audio scrubber -->
  <line x1="24" y1="72" x2="24" y2="178" stroke="#ffffff" stroke-width="2" opacity="0.85">
    <animate attributeName="x1" values="24;876;24" dur="8s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="x2" values="24;876;24" dur="8s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </line>

  <!-- Evidence link markers pulsing under decision facets -->
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#7fb0ff">
    <text x="150" y="196">#1 evidence</text>
    <circle cx="140" cy="192" r="3" fill="#7fb0ff">
      <animate attributeName="r" values="3;5;3" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="378" y="196">#4 evidence</text>
    <circle cx="368" cy="192" r="3" fill="#7fb0ff">
      <animate attributeName="r" values="3;5;3" dur="2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
